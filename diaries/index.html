<title>Diaries</title>

<!-- Tufte CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tufte-css/1.8.0/tufte.min.css"/>

<style>
  .pi-tufte { max-width: 70ch; margin: 0 auto; }

  /* Everything from here to the payload is public. The poem is not. */
  .gate { margin-top: 4rem; }
  .gate-title { font-size: 1.9rem; margin: 0 0 0.2rem; font-weight: 700; font-style: normal; }
  .gate-blurb { font-size: 1.15rem; margin: 0 0 1.8rem; color: #666; font-style: italic; }
  .gate-form { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: flex-end; }
  .gate-label { display: block; font-size: 0.8rem; color: #666; margin-bottom: 0.25rem; }
  .gate input { font-family: inherit; font-size: 1rem; padding: 0.45rem 0.6rem;
    border: 1px solid #aaa; background: #fffff8; color: inherit; width: 26ch; max-width: 100%; }
  .gate input:focus { outline: 2px solid #666; outline-offset: 1px; }
  .gate button { font-family: inherit; font-size: 1rem; padding: 0.45rem 1.1rem;
    border: 1px solid #111; background: #111; color: #fffff8; cursor: pointer; }
  .gate button:hover:not(:disabled) { opacity: 0.85; }
  .gate button:disabled { opacity: 0.45; cursor: default; }
  .gate-msg { min-height: 1.4rem; margin: 0.9rem 0 0; font-size: 0.9rem; color: #a00; }
  .gate-hint { font-size: 0.8rem; color: #666; margin-top: 1.8rem; font-style: italic; }
</style>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

<main class="pi-tufte gate" id="gate">
  <h2 class="gate-title"><i>Diaries</i></h2>
  <p class="gate-blurb">Locked. This text is encrypted inside the page and needs a passphrase to be read.</p>

  <form class="gate-form" id="gate-form" autocomplete="off">
    <div>
      <label class="gate-label" for="pass">Passphrase</label>
      <input id="pass" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required/>
    </div>
    <button id="unlock" type="submit">Read</button>
  </form>

  <p class="gate-msg" id="gate-msg" role="status" aria-live="polite"></p>
  <p class="gate-hint">No data is sent anywhere. The text is decrypted locally in your own browser.</p>
</main>

<div id="content" hidden></div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var gate = $('gate'), form = $('gate-form'), pass = $('pass'),
      btn = $('unlock'), msg = $('gate-msg'), content = $('content');

  if (!window.crypto || !window.crypto.subtle) {
    form.hidden = true;
    msg.textContent = 'This browser will not decrypt the text: WebCrypto needs a secure context. ' +
      'Open the page over https rather than from a file path.';
    return;
  }

  var payload = JSON.parse($('payload').textContent);
  var iterations = Number(payload.iter) || 600000;

  function fromBase64(str) {
    var bin = atob(str), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function decrypt(passphrase) {
    return crypto.subtle
      .importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: fromBase64(payload.salt), iterations: iterations, hash: 'SHA-256' },
          base,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: fromBase64(payload.iv) },
          key,
          fromBase64(payload.ct)
        );
      })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }

  function reveal(html) {
    content.innerHTML = html;
    gate.remove();
    content.hidden = false;

    var stale = content.querySelectorAll('script');
    for (var i = 0; i < stale.length; i++) {
      var old = stale[i];
      var fresh = document.createElement('script');
      for (var j = 0; j < old.attributes.length; j++) {
        fresh.setAttribute(old.attributes[j].name, old.attributes[j].value);
      }
      fresh.textContent = old.textContent;
      old.parentNode.replaceChild(fresh, old);
    }

    document.dispatchEvent(new Event('DOMContentLoaded'));
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (!pass.value) return;

    var phrase = pass.value;
    pass.disabled = true;
    btn.disabled = true;
    btn.textContent = 'Unlocking';
    msg.textContent = '';

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        decrypt(phrase).then(reveal).catch(function (err) {
          if (err && err.name !== 'OperationError') console.error(err);
          pass.disabled = false;
          btn.disabled = false;
          btn.textContent = 'Read';
          msg.textContent = 'That passphrase did not unlock the text. Check for typos, then try again.';
          pass.focus();
          pass.select();
        });
      });
    });
  });

  pass.focus();
})();
</script>
