<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var gate = $('gate'), form = $('gate-form'), pass = $('pass'),
      btn = $('unlock'), msg = $('gate-msg'), content = $('content');

  if (!window.crypto || !window.crypto.subtle) {
    form.hidden = true;
    msg.textContent = 'This browser will not decrypt the text: WebCrypto needs a secure context. ' +
      'Open the page over https rather than from a file path.';
    return;
  }

  var payload = JSON.parse($('payload').textContent);
  var iterations = Number(payload.iter) || 600000;

  function fromBase64(str) {
    var bin = atob(str), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  /* An encrypted attachment - a photograph, a voice note - held in its own file
     instead of inlined as a data URI. Inlining costs 4/3 for the data URI and
     another 4/3 once the article is encrypted and base64-ed, so a 9 MB clip adds
     16 MB to this page; and since every rebuild re-encrypts under a fresh salt, the
     ciphertext changes wholesale, so git stores another 16 MB with every entry
     rather than a delta. Kept apart it is stored raw, committed once, and fetched
     only if the reader actually asks for it.

     The attachment is NOT encrypted under the passphrase-derived key, and the reason
     is the salt: a fresh one is drawn on every rebuild, so that key changes each time
     the page is regenerated and every attachment would have to be re-encrypted and
     re-committed along with it - the very churn this is meant to avoid. Instead each
     attachment carries its own random key, written into the article, which is itself
     encrypted. Unlocking the article yields the key; the attachment file never
     changes. Its IV lives in the first 12 bytes of the file, so a key is never reused
     against a repeated IV. On its own the file is ciphertext, and publishing it beside
     the page gives nothing away. */
  function asset(url, rawKey, onProgress) {
    return crypto.subtle
      .importKey('raw', fromBase64(rawKey), 'AES-GCM', false, ['decrypt'])
      .then(function (key) {
        return fetch(url).then(function (res) {
          if (!res.ok) throw new Error('could not fetch ' + url + ' (' + res.status + ')');
          var total = Number(res.headers.get('Content-Length')) || 0;
          if (!onProgress || !res.body || !res.body.getReader) return res.arrayBuffer();
          var reader = res.body.getReader(), parts = [], seen = 0;
          return (function pump() {
            return reader.read().then(function (step) {
              if (step.done) {
                var all = new Uint8Array(seen), at = 0;
                for (var i = 0; i < parts.length; i++) { all.set(parts[i], at); at += parts[i].length; }
                return all.buffer;
              }
              parts.push(step.value);
              seen += step.value.length;
              if (total) onProgress(seen / total);
              return pump();
            });
          })();
        }).then(function (buf) {
          var bytes = new Uint8Array(buf);
          return crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: bytes.subarray(0, 12) },
            key,
            bytes.subarray(12)
          );
        });
      });
  }

  window.__sealed = { asset: asset };

  function decrypt(passphrase) {
    return crypto.subtle
      .importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: fromBase64(payload.salt), iterations: iterations, hash: 'SHA-256' },
          base,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: fromBase64(payload.iv) },
          key,
          fromBase64(payload.ct)
        );
      })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }

  function reveal(html) {
    content.innerHTML = html;
    gate.remove();
    content.hidden = false;

    var stale = content.querySelectorAll('script');
    for (var i = 0; i < stale.length; i++) {
      var old = stale[i];
      var fresh = document.createElement('script');
      for (var j = 0; j < old.attributes.length; j++) {
        fresh.setAttribute(old.attributes[j].name, old.attributes[j].value);
      }
      fresh.textContent = old.textContent;
      old.parentNode.replaceChild(fresh, old);
    }

    document.dispatchEvent(new Event('DOMContentLoaded'));
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (!pass.value) return;

    var phrase = pass.value;
    pass.disabled = true;
    btn.disabled = true;
    btn.textContent = 'Unlocking';
    msg.textContent = '';

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        decrypt(phrase).then(reveal).catch(function (err) {
          if (err && err.name !== 'OperationError') console.error(err);
          pass.disabled = false;
          btn.disabled = false;
          btn.textContent = 'Read';
          msg.textContent = 'That passphrase did not unlock the text. Check for typos, then try again.';
          pass.focus();
          pass.select();
        });
      });
    });
  });

  pass.focus();
})();
</script>
